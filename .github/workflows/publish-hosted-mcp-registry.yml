name: Publish Voidly hosted MCP to MCP Registry

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH-VOIDLY-HOSTED-MCP-2.25.0 to publish this version.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-voidly-hosted-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'voidly-ai/pay-mcp' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.confirm == 'PUBLISH-VOIDLY-HOSTED-MCP-2.25.0'
    runs-on: ubuntu-24.04
    environment: mcp-registry-publish
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Configure required reviewers, a main-only branch rule, and this variable
      # on the protected environment before dispatch. The name alone is not protection.
      - name: Require configured publish environment
        env:
          REVIEW_GATE: ${{ vars.MCP_VOIDLY_HOSTED_225_ENV_REVIEWED }}
        run: test "$REVIEW_GATE" = 'reviewed-main-only'

      - name: Verify hosted manifest and unpublished version
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');

          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            process.env.GITHUB_SHA, 'Checkout differs from reviewed main commit');
          const server = JSON.parse(readFileSync('registry/hosted/server.json', 'utf8'));
          assert.equal(server.name, 'io.github.voidly-ai/voidly-hosted');
          assert.equal(server.version, '2.25.0');
          assert.deepEqual(server.repository, {
            url: 'https://github.com/voidly-ai/pay-mcp',
            source: 'github', subfolder: 'registry/hosted',
          });
          assert.equal(server.packages, undefined, 'Hosted entry must not claim an npm package');
          assert.deepEqual(server.remotes, [
            { type: 'streamable-http', url: 'https://api.voidly.ai/mcp' },
          ]);

          (async () => {
            const url = 'https://registry.modelcontextprotocol.io/v0.1/servers/'
              + encodeURIComponent(server.name) + '/versions/' + server.version;
            const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
            assert.equal(response.status, 404, 'Exact Registry version exists or preflight failed');
            console.log('Public hosted manifest matches the reviewed version and is unpublished.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Verify served MCP contract before authentication
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { createHash } = require('node:crypto');
          const expectedVersion = '2.25.0';
          const expectedCount = 75;
          const url = 'https://api.voidly.ai/mcp';
          const headers = {
            'User-Agent': 'VoidlyMcpRegistryPreflight/1.0',
            'Cache-Control': 'no-cache',
          };
          async function getJson(target) {
            const response = await fetch(target, {
              headers, signal: AbortSignal.timeout(15000),
            });
            assert.equal(response.status, 200, target + ' returned ' + response.status);
            return response.json();
          }
          async function rpc(method, params) {
            const response = await fetch(url, {
              method: 'POST', signal: AbortSignal.timeout(15000), headers: {
                ...headers,
                'Accept': 'application/json, text/event-stream',
                'Content-Type': 'application/json',
                'MCP-Protocol-Version': '2025-06-18',
              },
              body: JSON.stringify({ jsonrpc: '2.0', id: method, method, params }),
            });
            assert.equal(response.status, 200, method + ' returned ' + response.status);
            return response.json();
          }

          (async () => {
            const info = await getJson(url);
            const card = await getJson('https://api.voidly.ai/.well-known/mcp/server-card.json');
            assert.equal(info.version, expectedVersion);
            assert.equal(info.tools, expectedCount);
            assert.equal(card.version, expectedVersion);
            assert.equal(card.tool_count, expectedCount);
            assert.deepEqual(card.transport, { type: 'streamable-http', url });
            const initialized = await rpc('initialize', {
              protocolVersion: '2025-06-18', capabilities: {},
              clientInfo: { name: 'voidly-registry-preflight', version: '1.0.0' },
            });
            assert.equal(initialized.result?.serverInfo?.version, expectedVersion);
            const listed = await rpc('tools/list', {});
            const names = listed.result?.tools?.map(tool => tool.name);
            assert.ok(Array.isArray(names), 'tools/list is missing tools');
            assert.equal(names.length, expectedCount);
            assert.equal(new Set(names).size, expectedCount, 'Duplicate tool name');
            const namesHash = createHash('sha256').update(JSON.stringify(names)).digest('hex');
            assert.equal(namesHash, 'c92944a3f2a0fd9cb5ff9db6dfab49a414e21388a719fbb671e7b3c49da92a7b',
              'Served tool inventory/order differs from reviewed 2.25.0 catalog');
            assert.deepEqual(card.tools.map(tool => tool.name), names);
            console.log('Public version, card, initialize, and tools/list count/order agree.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Download pinned official publisher
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz' -o mcp-publisher.tar.gz
          echo 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz' | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate hosted manifest before authentication
        run: ./mcp-publisher validate registry/hosted/server.json

      - name: Authenticate as the public repository owner via OIDC
        id: login
        run: ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io

      - name: Publish hosted version once
        id: publish
        continue-on-error: true
        run: timeout 150s ./mcp-publisher publish registry/hosted/server.json

      - name: Reconcile exact public Registry readback
        if: always() && steps.login.outcome == 'success' && steps.publish.outcome != 'skipped'
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');

          const expected = JSON.parse(readFileSync('registry/hosted/server.json', 'utf8'));
          const url = 'https://registry.modelcontextprotocol.io/v0.1/servers/'
            + encodeURIComponent(expected.name) + '/versions/' + expected.version;
          (async () => {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
                assert.equal(response.status, 200, 'Registry readback returned ' + response.status);
                const row = await response.json();
                assert.equal(row.server?.name, expected.name);
                assert.equal(row.server?.version, expected.version);
                assert.equal(row.server?.title, expected.title);
                assert.equal(row.server?.description, expected.description);
                assert.deepEqual(row.server?.remotes, expected.remotes);
                assert.deepEqual(row.server?.repository, expected.repository);
                assert.equal(row._meta?.['io.modelcontextprotocol.registry/official']?.status, 'active');
                console.log('Exact public hosted Registry entry is active; publisher outcome: '
                  + process.env.PUBLISH_OUTCOME + '.');
                return;
              } catch (error) {
                lastError = error;
                if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 3000));
              }
            }
            throw new Error('Registry outcome remains unverified after one publish attempt: '
              + lastError);
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
